services:
  media-tools:
    build:
      context: .
      dockerfile: Dockerfile.dev
      secrets:
        - npmrc
    container_name: media-tools
    image: media-tools
    ports:
      - "3000:3000"
      - "24678:24678"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - media-tools-node-modules:/app/node_modules
      - media-tools-nuxt:/app/.nuxt
    restart: unless-stopped

secrets:
  npmrc:
    file: ${NPMRC_FILE:-~/.npmrc}

volumes:
  media-tools-node-modules:
  media-tools-nuxt:
